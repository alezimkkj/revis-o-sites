<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão Prática de JavaScript</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
    }

    .destaque {
      background-color: yellow;
    }

    .calculadora input {
      padding: 8px;
      margin: 5px 5px 10px 0;
      font-size: 16px;
      width: 140px;
    }

    .calculadora button {
      padding: 8px 12px;
      margin: 3px;
      font-size: 14px;
      cursor: pointer;
    }

    #resultado {
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1 id="titulo">Texto Original</h1>
    <button id="btnMudar">Mudar Título</button>
  </div>

  <div class="box">
    <h2>Contador: <span id="contador">0</span></h2>
    <button id="btnIncrementar">Incrementar</button>
  </div>

  <div class="box">
    <p class="paragrafo">Parágrafo 1</p>
    <p class="paragrafo">Parágrafo 2</p>
    <button id="btnDestacar">Destacar Parágrafos</button>
  </div>

  <div class="box">
    <input type="text" id="campoInput" placeholder="Digite algo aqui...">
    <p>Você está digitando: <span id="textoRefletido"></span></p>
  </div>

  <div class="box calculadora">
    <h1>Calculadora</h1>
    <input type="number" name="num1" id="num1" placeholder="Número 1">
    <input type="number" name="num2" id="num2" placeholder="Número 2">
    <br>
    <button id="btnSoma">Soma</button>
    <button id="btnSub">Subtração</button>
    <button id="btnMulti">Multiplicação</button>
    <button id="btnDiv">Divisão</button>
    <p id="resultado">O resultado será exibido aqui.</p>
  </div>

  <script src="script.js"></script>
  <script src="calculadora.js"></script>
</body>

</html>
